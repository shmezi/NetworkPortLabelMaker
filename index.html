<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Port Label Generator</title>
    <style>
        :root {
            --sidebar-width: 400px;
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --success-hover: #047857;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            direction: ltr;
        }

        #sidebar {
            width: var(--sidebar-width);
            background: var(--surface-color);
            padding: 20px;
            box-shadow: 4px 0 20px rgba(0,0,0,0.04);
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 10;
        }

        body[dir="rtl"] #sidebar {
            border-right: none;
            border-left: 1px solid var(--border-color);
            box-shadow: -4px 0 20px rgba(0,0,0,0.04);
        }

        #main-content {
            padding: 24px;
            flex-grow: 1;
            box-sizing: border-box;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .lang-toggle { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .lang-toggle button {
            background: #f1f5f9; color: #475569; border: 1px solid var(--border-color); padding: 5px 12px;
            font-size: 0.8em; border-radius: 20px; cursor: pointer; font-weight: 600; width: auto;
        }
        .lang-toggle button:hover { background: #e2e8f0; }

        h2 { color: var(--text-main); margin-top: 0; margin-bottom: 14px; font-size: 1.15em; font-weight: 700; }
        h3 { color: var(--text-main); margin-top: 0; margin-bottom: 10px; font-size: 0.95em; font-weight: 600; border-bottom: 2px solid var(--border-color); padding-bottom: 6px;}

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 0.8em; color: var(--text-muted); }

        input[type="number"], input[type="text"], input[type="file"], select {
            width: 100%; padding: 8px 10px; box-sizing: border-box;
            border: 1px solid #cbd5e1; border-radius: 6px;
            background: #fff; color: var(--text-main);
            font-size: 0.9em; transition: all 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        button {
            font-family: inherit; font-weight: 600; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; width: 100%; padding: 9px 12px;
            background: var(--primary); color: white; border: none; font-size: 0.9em;
        }
        button:hover { background: var(--primary-hover); }

        button.btn-success { background-color: var(--success); margin-top: 10px; font-size: 1em; padding: 12px; }
        button.btn-success:hover { background-color: var(--success-hover); }

        button.btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
        button.btn-secondary:hover { background: #e2e8f0; }

        button.delete-btn {
            background: transparent; color: #94a3b8; border: 1px solid transparent;
            width: 28px; height: 28px; padding: 0; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 0.85em;
            flex-shrink: 0; transition: all 0.2s;
        }
        button.delete-btn:hover { background: #fee2e2; color: var(--danger); border-color: #fecaca; }

        /* --- Sections container fitting screen --- */
        .view-container {
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            width: 100%; box-sizing: border-box; overflow: hidden; flex-shrink: 0;
        }

        .scale-wrapper { transform-origin: top left; width: max-content; }
        body[dir="rtl"] .scale-wrapper { transform-origin: top right; }

        /* For Hardware View specifically */
        .rack-visual-row {
            display: flex; flex-wrap: nowrap; margin-bottom: 10px; background: #f1f5f9;
            padding: 8px; border-radius: 6px; width: max-content; border: 1px solid #e2e8f0;
        }

        .hardware-port {
            background: #fff; border: 1px solid #cbd5e1; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 10px; text-align: center; border-radius: 4px; flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .hardware-port .pins { width: 50%; height: 2px; background: #f59e0b; margin-bottom: 3px; border-radius: 1px; }

        /* --- Print Sheets Styling (Optimized for A4 Packing) --- */
        .page {
            background: white; color: black; margin-bottom: 20px; padding: 20px;
            border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            max-width: 190mm;
            box-sizing: border-box;
        }
        .page-title { text-align: center; margin-bottom: 15px; color: #475569; font-size: 1em; font-weight: 700; }

        .print-labels-container {
            display: flex;
            flex-wrap: wrap;
            gap: 3mm;
            justify-content: flex-start;
        }

        .label {
            border: 1px solid #0f172a;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; box-sizing: border-box; text-align: center; font-weight: 700;
            font-size: 11px; line-height: 1.2;
            border-radius: 6px;
            flex-shrink: 0; overflow: hidden;
            background-color: #fff;
        }

        /* --- Sidebar Category Manager Styles --- */
        .cat-manager {
            background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px;
            padding: 12px; margin-bottom: 14px;
        }
        .cat-item-row {
            display: flex; gap: 6px; align-items: center; margin-bottom: 8px;
            background: #fff; padding: 6px 8px; border-radius: 6px; border: 1px solid #e2e8f0;
        }
        .cat-item-row input { flex: 2; border: none; background: transparent; padding: 2px; font-size: 0.9em; }
        .cat-item-row input:focus { box-shadow: none; }
        .cat-item-row select { flex: 1.2; padding: 4px; font-size: 0.85em; }

        /* --- Main Port Table Styles --- */
        .table-container {
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
        }
        body[dir="rtl"] table { text-align: right; }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            background: #fff;
        }

        th {
            background: #f8fafc;
            font-weight: 600;
            font-size: 0.8em;
            color: var(--text-muted);
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 2px solid var(--border-color);
        }

        tbody tr:last-child td { border-bottom: none; }
        td input, td select { width: 100%; padding: 6px 8px; margin: 0; box-sizing: border-box; }

        .action-cols { width: 110px; text-align: center; }
        .action-btns { display: flex; gap: 4px; align-items: center; justify-content: flex-start; }
        body[dir="rtl"] .action-btns { justify-content: flex-end; }
        .action-btns button { padding: 4px 8px; font-size: 0.8em; width: auto; height: 32px; display: flex; align-items: center; justify-content: center; }

        @media print {
            body { background: white; color: black; display: block; height: auto; overflow: visible; }
            #sidebar { display: none; }
            #main-content { padding: 0; height: auto; overflow: visible; display: block; background: white; gap: 0; }
            .view-container { background: none; border: none; padding: 0; box-shadow: none; margin-bottom: 0; overflow: visible; }
            .hardware-section, .view-container:nth-child(1), .view-container:nth-child(2) { display: none; }

            .scale-wrapper { transform: none !important; width: 100% !important; }
            .scale-container-sizer { height: auto !important; }

            .page {
                margin: 0; padding: 0; box-shadow: none; border: none;
                page-break-after: always; max-width: none; width: 100%;
            }
            .page-title { display: none; }
            @page { size: auto; margin: 10mm; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="lang-toggle">
        <button id="langToggleBtn" onclick="toggleLanguage()">עברית</button>
    </div>

    <h2 data-i18n="settings">Settings</h2>

    <h3 data-i18n="dim_header">1. Dimensions (mm)</h3>
    <div class="form-group">
        <label data-i18n="ports_row">Number of Ports in One Row</label>
        <input type="number" id="portsPerRow" class="config-input" value="24" min="1">
    </div>
    <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
            <label data-i18n="port_w">Port Width</label>
            <input type="number" id="portWidth" class="config-input" value="15" min="1">
        </div>
        <div class="form-group" style="flex: 1;">
            <label data-i18n="port_h">Port Height</label>
            <input type="number" id="portHeight" class="config-input" value="10" min="1">
        </div>
    </div>
    <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
            <label data-i18n="std_gap">Normal Gap</label>
            <input type="number" id="standardGap" class="config-input" value="2" min="0">
        </div>
        <div class="form-group" style="flex: 1;">
            <label data-i18n="seg_gap">Group Gap (0 = Normal)</label>
            <input type="number" id="segmentGap" class="config-input" value="8" min="0">
        </div>
    </div>
    <div class="form-group">
        <label data-i18n="seg_size">Ports per Group</label>
        <input type="number" id="segmentSize" class="config-input" value="4" min="1">
    </div>

    <br>

    <h3 data-i18n="sys_config">2. Categories & Colors</h3>
    <div class="form-group">
        <label data-i18n="avail_colors">Available Colors (Comma separated)</label>
        <input type="text" id="availableColors" class="config-input" value="White, Blue, Yellow, Green, Red, Gray">
    </div>

    <!-- SIDEBAR CATEGORY MANAGER -->
    <div class="cat-manager">
        <label style="font-weight: 600; color: var(--text-main); margin-bottom: 8px;" data-i18n="manage_cats">Manage Categories</label>
        <div id="sidebarCatList" style="margin-bottom: 8px;">
            <!-- Category rows injected via JS -->
        </div>
        <button class="btn-secondary" onclick="addCategory()" data-i18n="add_cat">+ New Category</button>
    </div>

    <div class="form-group">
        <label data-i18n="print_mode">Print Output Mode</label>
        <select id="printMode" class="config-input">
            <option value="separate" data-i18n="mode_separate">Separate Pages (Colored Paper)</option>
            <option value="ink" data-i18n="mode_ink">Single Sheet (Colored Ink on Borders)</option>
        </select>
    </div>

    <div class="form-group" style="background: #f1f5f9; padding: 12px; border-radius: 6px; border: 1px dashed #cbd5e1;">
        <label style="color: var(--text-main); font-weight: 600;" data-i18n="bulk_add">Bulk Data Utilities</label>
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="btn-secondary" onclick="addSequence()" data-i18n="add_seq">Add Sequence</button>
            <input type="number" id="seqAmount" value="24" style="width: 70px;">
        </div>
        <button class="btn-secondary" onclick="downloadCsvTemplate()" data-i18n="dl_template" style="margin-bottom: 5px;">Download CSV Template</button>
        <input type="file" id="csvFile" accept=".csv" style="background: white;">
        <button class="btn-secondary" onclick="clearData()" style="margin-top: 10px; color: var(--danger); border-color: #fecaca; background: #fee2e2;" data-i18n="clear_all">Clear All Data</button>
    </div>

    <button class="btn-success" onclick="window.print()" data-i18n="print_btn">Print Label Sheets</button>
</div>

<div id="main-content">

    <!-- MAIN PORTS LIST TABLE -->
    <div class="view-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 data-i18n="editor_title" style="margin-bottom: 0;">Ports List Editor</h2>
            <button onclick="addPortEntry()" style="width: auto;" data-i18n="add_port">+ Add Port Entry</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th data-i18n="th_cat" style="width: 25%;">Category</th>
                    <th data-i18n="th_port" style="width: 45%;">Port Label / Number</th>
                    <th data-i18n="th_span" style="width: 15%;">Port Span</th>
                    <th data-i18n="th_action" class="action-cols">Actions</th>
                </tr>
                </thead>
                <tbody id="portsTableBody">
                <!-- Port entries injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="view-container">
        <h2 data-i18n="hw_title">Hardware Visualizer</h2>
        <div class="scale-container-sizer" id="hw-sizer">
            <div class="scale-wrapper" id="hardware-view-area"></div>
        </div>
    </div>

    <div class="view-container">
        <h2 data-i18n="pr_title">Print Preview</h2>
        <div class="scale-container-sizer" id="print-sizer">
            <div class="scale-wrapper" id="preview-area"></div>
        </div>
    </div>
</div>

<script>
    const i18n = {
        en: {
            settings: "Settings", dim_header: "1. Dimensions (mm)",
            ports_row: "Number of Ports in One Row", port_w: "Port Width", port_h: "Port Height",
            std_gap: "Normal Gap", seg_gap: "Group Gap (0 = Normal)", seg_size: "Ports per Group",
            sys_config: "2. Categories & Colors", avail_colors: "Available Colors (Comma separated)",
            manage_cats: "Manage Categories", add_cat: "+ New Category",
            print_mode: "Print Output Mode", mode_separate: "Separate Pages (Colored Paper)", mode_ink: "Single Sheet (Colored Ink on Borders)",
            bulk_add: "Bulk Data Utilities", add_seq: "Add Sequence", dl_template: "Download CSV Template", clear_all: "Clear All Data", print_btn: "Print Label Sheets",
            editor_title: "Ports List Editor", add_port: "+ Add Port Entry",
            th_port: "Port Label / Number", th_cat: "Category", th_span: "Port Span", th_action: "Actions",
            hw_title: "Hardware Visualizer", pr_title: "Print Sheets (A4 Pack)", paper_color: "Print on Paper Color:", sheet_color: "Continuous Print Sheet"
        },
        he: {
            settings: "הגדרות", dim_header: '1. מידות (מ"מ)',
            ports_row: "שקעים בשורה", port_w: "רוחב שקע", port_h: "גובה שקע",
            std_gap: "מרווח רגיל", seg_gap: "מרווח קבוצות (0 = רגיל)", seg_size: "שקעים בקבוצה",
            sys_config: "2. קטגוריות וצבעים", avail_colors: "צבעים זמינים (מופרדים בפסיק)",
            manage_cats: "ניהול קטגוריות", add_cat: "+ קטגוריה חדשה",
            print_mode: "מצב הדפסה", mode_separate: "דפים נפרדים (דפי צבע)", mode_ink: "דף רציף (גבולות צבעוניים)",
            bulk_add: "פעולות נתונים", add_seq: "הוסף רצף", dl_template: "הורד תבנית CSV", clear_all: "נקה את כל הנתונים", print_btn: "הדפס תוויות",
            editor_title: "עורך רשימת השקעים", add_port: "+ הוסף שקע",
            th_port: "טקסט/מספר שקע", th_cat: "קטגוריה", th_span: "פריסה", th_action: "פעולות",
            hw_title: "תצוגת חומרה", pr_title: "תצוגת הדפסה (דפי A4)", paper_color: "הדפס על דף בצבע:", sheet_color: "דף הדפסה רציף"
        }
    };

    let currentLang = 'en';
    let categories = [];
    let portsList = [];
    let colorOptions = [];
    let configInputTimeout = null;

    function generateId() { return Math.random().toString(36).substr(2, 9); }

    document.addEventListener("DOMContentLoaded", () => {
        loadSettingsFromStorage();

        document.querySelectorAll('.config-input').forEach(input => {
            input.addEventListener('input', (e) => {
                clearTimeout(configInputTimeout);
                configInputTimeout = setTimeout(() => {
                    saveSettingsToStorage();
                    const needsFullRebuild = (e.target.id === 'availableColors');
                    processLayout(needsFullRebuild);
                }, 100);
            });
        });

        window.addEventListener('resize', applyScaling);

        if(categories.length === 0 && portsList.length === 0) {
            updateColorOptions();
            categories.push({ id: generateId(), name: "Switch A", color: colorOptions[0] || "White" });
            addSequence(24, false);
        } else {
            processLayout(true);
        }
    });

    function saveSettingsToStorage() {
        const config = {
            portsPerRow: document.getElementById('portsPerRow').value,
            portWidth: document.getElementById('portWidth').value,
            portHeight: document.getElementById('portHeight').value,
            standardGap: document.getElementById('standardGap').value,
            segmentGap: document.getElementById('segmentGap').value,
            segmentSize: document.getElementById('segmentSize').value,
            availableColors: document.getElementById('availableColors').value,
            printMode: document.getElementById('printMode').value,
            lang: currentLang,
            categories: categories,
            portsList: portsList
        };
        localStorage.setItem('portLabelMakerConfigV3', JSON.stringify(config));
    }

    function loadSettingsFromStorage() {
        const stored = localStorage.getItem('portLabelMakerConfigV3');
        if (stored) {
            try {
                const config = JSON.parse(stored);
                document.getElementById('portsPerRow').value = config.portsPerRow || 24;
                document.getElementById('portWidth').value = config.portWidth || 15;
                document.getElementById('portHeight').value = config.portHeight || 10;
                document.getElementById('standardGap').value = config.standardGap || 2;
                document.getElementById('segmentGap').value = (config.segmentGap !== undefined) ? config.segmentGap : 8;
                document.getElementById('segmentSize').value = config.segmentSize || 4;
                document.getElementById('availableColors').value = config.availableColors || "White, Blue, Yellow, Green, Red, Gray";
                document.getElementById('printMode').value = config.printMode || "separate";

                categories = config.categories || [];
                portsList = config.portsList || [];

                if (config.lang && config.lang !== currentLang) toggleLanguage();
            } catch (e) { console.error("Could not parse local storage."); }
        }
    }

    function updateColorOptions() {
        const colorString = document.getElementById('availableColors').value;
        colorOptions = colorString.split(',').map(c => c.trim()).filter(c => c);
        if(colorOptions.length === 0) colorOptions = ['White'];
    }

    // --- Sidebar Category Manager Logic ---
    function renderSidebarCategories() {
        updateColorOptions();
        const container = document.getElementById('sidebarCatList');
        container.innerHTML = '';

        if(categories.length === 0) {
            container.innerHTML = `<span style="font-size:0.8em; color:var(--text-muted); display: block; padding: 4px;">No categories created yet.</span>`;
            return;
        }

        categories.forEach((cat, index) => {
            let colorSelectHtml = `<select onchange="updateSidebarCategory(${index}, 'color', this.value)">`;
            let found = false;
            colorOptions.forEach(c => {
                const selected = (c.toLowerCase() === cat.color.toLowerCase()) ? 'selected' : '';
                if (selected) found = true;
                colorSelectHtml += `<option value="${c}" ${selected}>${c}</option>`;
            });
            if (!found) colorSelectHtml += `<option value="${cat.color}" selected>${cat.color}</option>`;
            colorSelectHtml += `</select>`;

            let row = document.createElement('div');
            row.className = 'cat-item-row';
            row.innerHTML = `
                <input type="text" value="${cat.name}" oninput="updateSidebarCategory(${index}, 'name', this.value)" placeholder="Category Name">
                ${colorSelectHtml}
                <button class="delete-btn" onclick="deleteCategory(${index})" title="Delete Category">✕</button>
            `;
            container.appendChild(row);
        });
    }

    function addCategory(name = "New Category", color = null) {
        updateColorOptions();
        categories.push({
            id: generateId(),
            name: name,
            color: color || colorOptions[0]
        });
        processLayout(true);
    }

    function updateSidebarCategory(index, field, value) {
        categories[index][field] = value;
        scheduleRender();
    }

    function deleteCategory(index) {
        const catId = categories[index].id;
        if(portsList.some(p => p.categoryId === catId)) {
            if(!confirm("Some ports are assigned to this category. Delete anyway?")) return;
        }
        categories.splice(index, 1);
        processLayout(true);
    }

    // --- Main Ports Table Editor Logic ---
    function renderPortsTable() {
        updateColorOptions();
        const tbody = document.getElementById('portsTableBody');
        tbody.innerHTML = '';

        if(portsList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding: 15px;">No ports added yet. Click '+ Add Port Entry' below.</td></tr>`;
            return;
        }

        portsList.forEach((port, index) => {
            let tr = document.createElement('tr');

            let catSelectHtml = `<select onchange="updatePortEntry(${index}, 'categoryId', this.value)">`;
            categories.forEach(cat => {
                const selected = (cat.id === port.categoryId) ? 'selected' : '';
                catSelectHtml += `<option value="${cat.id}" ${selected}>${cat.name}</option>`;
            });
            catSelectHtml += `</select>`;

            tr.innerHTML = `
                <td>${catSelectHtml}</td>
                <td><input type="text" value="${port.text}" oninput="updatePortEntry(${index}, 'text', this.value)" placeholder=""></td>
                <td><input type="number" min="1" value="${port.span}" oninput="updatePortEntry(${index}, 'span', this.value)"></td>
                <td class="action-cols">
                    <div class="action-btns">
                        <button class="btn-secondary" onclick="movePort(${index}, -1)" ${index === 0 ? 'disabled' : ''}>↑</button>
                        <button class="btn-secondary" onclick="movePort(${index}, 1)" ${index === portsList.length - 1 ? 'disabled' : ''}>↓</button>
                        <button class="delete-btn" onclick="deletePortEntry(${index})" title="Delete Port">✕</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function addPortEntry() {
        if(categories.length === 0) {
            alert("Please create at least one category on the left sidebar first.");
            return;
        }

        portsList.push({
            id: generateId(),
            text: "",
            categoryId: categories[0].id,
            span: 1
        });
        processLayout(true);
    }

    function updatePortEntry(index, field, value) {
        if(field === 'span') value = parseInt(value) || 1;
        portsList[index][field] = value;
        scheduleRender();
    }

    function deletePortEntry(index) {
        portsList.splice(index, 1);
        processLayout(true);
    }

    function movePort(index, direction) {
        if (index + direction < 0 || index + direction >= portsList.length) return;
        const temp = portsList[index];
        portsList[index] = portsList[index + direction];
        portsList[index + direction] = temp;
        processLayout(true);
    }

    function scheduleRender() {
        saveSettingsToStorage();
        clearTimeout(window.renderTimeout);
        window.renderTimeout = setTimeout(() => { processLayout(false); }, 300);
    }

    function addSequence(n = null, overwrite = false) {
        updateColorOptions();
        const amount = n || parseInt(document.getElementById('seqAmount').value) || 24;

        if(categories.length === 0) {
            categories.push({ id: generateId(), name: "Switch A", color: colorOptions[0] || "White" });
        }

        if (overwrite) portsList = [];

        const defaultCatId = categories[0].id;
        for (let i = 1; i <= amount; i++) {
            portsList.push({
                id: generateId(),
                text: i.toString(),
                categoryId: defaultCatId,
                span: 1
            });
        }
        processLayout(true);
    }

    function clearData() {
        if (confirm("Are you sure you want to clear all ports and categories?")) {
            categories = [];
            portsList = [];
            processLayout(true);
        }
    }

    // --- CSV Handling ---
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            parseCSV(e.target.result);
            document.getElementById('csvFile').value = '';
            processLayout(true);
        };
        reader.readAsText(file);
    });

    function parseCSV(text) {
        categories = [];
        portsList = [];
        const lines = text.split('\n');
        let startIndex = (lines[0] && lines[0].toLowerCase().includes('category')) ? 1 : 0;

        let catMap = {};

        for (let i = startIndex; i < lines.length; i++) {
            const line = lines[i];
            if (line.trim() === '') continue;
            const parts = line.split(',').map(p => p.trim());

            let catName = parts[0] || 'Unknown';
            let portText = parts[1] || '';
            let color = parts[2] || 'White';
            let span = parseInt(parts[3]) || 1;

            if(!catMap[catName]) {
                let newCatId = generateId();
                categories.push({ id: newCatId, name: catName, color: color });
                catMap[catName] = newCatId;
            }

            portsList.push({
                id: generateId(),
                text: portText,
                categoryId: catMap[catName],
                span: span
            });
        }
    }

    function downloadCsvTemplate() {
        const csvContent = "Category,Port,Color,PortSpan\nSwitch A,1,White,1\nSwitch A,2,White,1\nMain Uplink,Uplink,Blue,2\nStorage SAN,SAN,Green,4";
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "ports_list_template.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- Visualizer & Render Logic ---
    function processLayout(fullRebuild = true) {
        if (fullRebuild) {
            renderSidebarCategories();
            renderPortsTable();
        }
        saveSettingsToStorage();

        const portsPerRow = parseInt(document.getElementById('portsPerRow').value) || 1;
        const portWidth = parseFloat(document.getElementById('portWidth').value) || 0;
        const portHeight = parseFloat(document.getElementById('portHeight').value) || 0;
        const standardGap = parseFloat(document.getElementById('standardGap').value) || 0;
        const segmentSize = parseInt(document.getElementById('segmentSize').value) || 1;

        let segmentGapRaw = parseFloat(document.getElementById('segmentGap').value);
        const segmentGap = (isNaN(segmentGapRaw) || segmentGapRaw === 0) ? standardGap : segmentGapRaw;

        const printMode = document.getElementById('printMode').value;

        let catLookup = {};
        categories.forEach(c => catLookup[c.id] = c);

        let flattenedData = [];
        portsList.forEach(port => {
            let cat = catLookup[port.categoryId] || { name: "Unassigned", color: "White" };
            flattenedData.push({
                text1: cat.name,
                text2: port.text,
                color: cat.color,
                span: port.span
            });
        });

        let expandedItems = [];
        let currentPortIndex = 0;

        flattenedData.forEach((item) => {
            let spanLeft = item.span;
            while (spanLeft > 0) {
                const spaceInRow = portsPerRow - currentPortIndex;
                const spanThisRow = Math.min(spanLeft, spaceInRow);

                expandedItems.push({
                    text1: item.text1,
                    text2: item.text2,
                    color: item.color,
                    span: spanThisRow,
                    startIndex: currentPortIndex
                });

                currentPortIndex += spanThisRow;
                spanLeft -= spanThisRow;
                if (currentPortIndex >= portsPerRow) currentPortIndex = 0;
            }
        });

        renderHardwareView(expandedItems, portsPerRow, portWidth, portHeight, standardGap, segmentSize, segmentGap);
        renderPrintSheets(expandedItems, portsPerRow, portWidth, portHeight, standardGap, segmentSize, segmentGap, printMode);

        setTimeout(applyScaling, 0);
    }

    function renderHardwareView(items, portsPerRow, portWidth, portHeight, standardGap, segmentSize, segmentGap) {
        const hwViewArea = document.getElementById('hardware-view-area');
        hwViewArea.innerHTML = '';

        let rowDiv = document.createElement('div');
        rowDiv.className = 'rack-visual-row';
        let portCountInRow = 0;

        items.forEach(item => {
            for (let i = 0; i < item.span; i++) {
                let portEl = document.createElement('div');
                portEl.className = 'hardware-port';

                const finalWidth = `${portWidth}mm`;
                portEl.style.width = finalWidth;
                portEl.style.minWidth = finalWidth;
                portEl.style.maxWidth = finalWidth;
                portEl.style.height = `${portHeight + 8}mm`;

                if (item.color.toLowerCase() !== 'white') {
                    portEl.style.borderBottom = `3px solid ${item.color}`;
                }

                portEl.innerHTML = `<div class="pins"></div><span style="font-size:7px; overflow:hidden; white-space:nowrap; text-overflow:clip; width:90%;">${item.text2 || item.text1}</span>`;

                let directionMargin = currentLang === 'en' ? 'marginRight' : 'marginLeft';
                let regularMargin = standardGap;

                if ((portCountInRow + 1) % segmentSize === 0) regularMargin = segmentGap;
                if ((portCountInRow + 1) % portsPerRow === 0) regularMargin = 0;

                portEl.style[directionMargin] = `${regularMargin}mm`;

                rowDiv.appendChild(portEl);
                portCountInRow++;

                if (portCountInRow >= portsPerRow) {
                    hwViewArea.appendChild(rowDiv);
                    rowDiv = document.createElement('div');
                    rowDiv.className = 'rack-visual-row';
                    portCountInRow = 0;
                }
            }
        });

        if (portCountInRow > 0) hwViewArea.appendChild(rowDiv);
    }

    function renderPrintSheets(items, portsPerRow, portWidth, portHeight, standardGap, segmentSize, segmentGap, printMode) {
        const previewArea = document.getElementById('preview-area');
        previewArea.innerHTML = '';

        if (printMode === 'separate') {
            let colorGroups = {};
            items.forEach(item => {
                const colorKey = item.color.trim();
                if (!colorGroups[colorKey]) colorGroups[colorKey] = [];
                colorGroups[colorKey].push(item);
            });

            for (const [color, colorItems] of Object.entries(colorGroups)) {
                buildPaginatedPages(colorItems, portsPerRow, portWidth, portHeight, standardGap, segmentSize, segmentGap, color, false);
            }
        } else {
            buildPaginatedPages(items, portsPerRow, portWidth, portHeight, standardGap, segmentSize, segmentGap, 'Mixed', true);
        }
    }

    function buildPaginatedPages(items, portsPerRow, portWidth, portHeight, standardGap, segmentSize, segmentGap, groupTitle, useInk) {
        const previewArea = document.getElementById('preview-area');

        // Estimate A4 capacity per page. A standard A4 printable area width ~190mm, height ~260mm.
        // Let's pack items sequentially into pages, checking total accumulated height or item count per page.
        // A safe estimation for standard label blocks fitting comfortably onto an A4 page:
        // Max horizontal width per row is ~180mm. Let's calculate items per row based on label size + gap.

        let pages = [];
        let currentPageItems = [];
        let currentRowWidth = 0;
        let currentRowHeight = portHeight + 3; // label height + vertical gap (3mm)
        let currentPageTotalHeight = 0;
        const maxPageHeight = 240; // mm safe height for A4 layout block
        const maxPageWidth = 185;  // mm safe width for A4 layout block

        items.forEach(item => {
            // Calculate exact width of this label
            let totalWidth = (item.span * portWidth) + ((item.span - 1) * standardGap);
            let extraGaps = 0;
            for (let s = 1; s < item.span; s++) {
                if ((item.startIndex + s) % segmentSize === 0) extraGaps++;
            }
            totalWidth += extraGaps * (segmentGap - standardGap);
            let itemTotalSpace = totalWidth + 3; // including 3mm right gap spacing

            // Check if it fits in the current row of the page layout
            if (currentRowWidth + itemTotalSpace > maxPageWidth) {
                // Move to next row on the same page
                currentPageTotalHeight += currentRowHeight;
                currentRowWidth = itemTotalSpace;
            } else {
                currentRowWidth += itemTotalSpace;
            }

            // Check if it exceeds the page height limit -> push current page and start a new one
            if (currentPageTotalHeight + currentRowHeight > maxPageHeight && currentPageItems.length > 0) {
                pages.push(currentPageItems);
                currentPageItems = [];
                currentPageTotalHeight = 0;
                currentRowWidth = itemTotalSpace;
            }

            currentPageItems.push({ item, totalWidth });
        });

        if (currentPageItems.length > 0) {
            pages.push(currentPageItems);
        }

        // Render each generated page
        pages.forEach((pageItems, pageIdx) => {
            let pageDiv = document.createElement('div');
            pageDiv.className = 'page';

            let title = document.createElement('div');
            title.className = 'page-title';
            let pageLabelSuffix = pages.length > 1 ? ` (Part ${pageIdx + 1}/${pages.length})` : '';
            title.textContent = (useInk ? i18n[currentLang].sheet_color : `${i18n[currentLang].paper_color} ${groupTitle}`) + pageLabelSuffix;
            pageDiv.appendChild(title);

            let labelsContainer = document.createElement('div');
            labelsContainer.className = 'print-labels-container';

            pageItems.forEach(entry => {
                let item = entry.item;
                let labelDiv = document.createElement('div');
                labelDiv.className = 'label';

                labelDiv.style.width = `${entry.totalWidth}mm`;
                labelDiv.style.minWidth = `${entry.totalWidth}mm`;
                labelDiv.style.maxWidth = `${entry.totalWidth}mm`;
                labelDiv.style.height = `${portHeight}mm`;

                let catColorStyle = "";
                if (useInk && item.color.toLowerCase() !== 'white') {
                    labelDiv.style.borderColor = item.color;
                    labelDiv.style.borderWidth = '2px';
                    catColorStyle = `color: ${item.color};`;
                }

                labelDiv.innerHTML = `<div style="overflow:hidden; white-space:nowrap; text-overflow:clip; width:100%; padding:0 2px; ${catColorStyle}">${item.text1}</div>` +
                    (item.text2 ? `<div style="font-size:9px; font-weight:normal; overflow:hidden; white-space:nowrap; text-overflow:clip; width:100%; color:#333;">${item.text2}</div>` : '');

                labelsContainer.appendChild(labelDiv);
            });

            pageDiv.appendChild(labelsContainer);
            previewArea.appendChild(pageDiv);
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'he' : 'en';
        document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
        document.getElementById('langToggleBtn').innerText = currentLang === 'en' ? 'עברית' : 'English';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
        });

        processLayout(true);
    }

    function applyScaling() {
        const containers = document.querySelectorAll('.view-container');
        containers.forEach(container => {
            if(container.querySelector('.table-container')) return;

            const wrapper = container.querySelector('.scale-wrapper');
            const sizer = container.querySelector('.scale-container-sizer');
            if (!wrapper || !sizer) return;

            const availableWidth = container.clientWidth - 48;
            const requiredWidth = wrapper.scrollWidth;

            if (requiredWidth > availableWidth && requiredWidth > 0) {
                const scale = availableWidth / requiredWidth;
                wrapper.style.transform = `scale(${scale})`;
                sizer.style.height = `${wrapper.scrollHeight * scale}px`;
            } else {
                wrapper.style.transform = 'none';
                sizer.style.height = 'auto';
            }
        });
    }
</script>
